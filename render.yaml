services:
  - type: web
    name: invoice-handler-api
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip wheel &&
      pip install -r requirements.txt
    startCommand: |
      alembic upgrade head &&
      python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: LLM_MODEL
        value: gpt-3.5-turbo
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHON_VERSION
        value: 3.11.9
